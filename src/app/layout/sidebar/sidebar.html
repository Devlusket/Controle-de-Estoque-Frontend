<mat-nav-list>
  <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
    <mat-icon matListItemIcon>dashboard</mat-icon>
    <span matListItemTitle>Dashboard</span>
  </a>

  <a mat-list-item routerLink="/movimentacoes" routerLinkActive="active">
    <mat-icon matListItemIcon>swap_horiz</mat-icon>
    <span matListItemTitle>Movimentações</span>
  </a>

  <a mat-list-item routerLink="/produtos" routerLinkActive="active">
    <mat-icon matListItemIcon>inventory_2</mat-icon>
    <span matListItemTitle>Produtos</span>
  </a>

  @if (authService.isAdmin()) {
    <a mat-list-item routerLink="/cidades" routerLinkActive="active">
      <mat-icon matListItemIcon>location_city</mat-icon>
      <span matListItemTitle>Cidades</span>
    </a>

    <a mat-list-item routerLink="/usuarios" routerLinkActive="active">
      <mat-icon matListItemIcon>people</mat-icon>
      <span matListItemTitle>Usuários</span>
    </a>
  }
</mat-nav-list>
