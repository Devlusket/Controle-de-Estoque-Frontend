<div class="bg-white rounded-lg border border-gray-200 p-4 sm:p-6 max-w-lg">
  <div class="mb-6">
    <h2 class="text-base font-semibold text-gray-900">
      {{ id ? 'Editar Cidade' : 'Nova Cidade' }}
    </h2>
    <p class="text-sm text-gray-500 mt-0.5">
      {{ id ? 'Atualize os dados da cidade' : 'Preencha os dados da nova cidade' }}
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-gray-700">Nome</label>
      <input
        formControlName="nome"
        type="text"
        placeholder="Ex: Belo Horizonte"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder:text-gray-400"
      />
      @if (form.get('nome')?.invalid && form.get('nome')?.touched) {
        <span class="text-xs text-red-500">Nome obrigatório</span>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-gray-700">Estado (UF)</label>
      <input
        formControlName="estado"
        type="text"
        placeholder="Ex: MG"
        maxlength="2"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder:text-gray-400 uppercase"
      />
      @if (form.get('estado')?.invalid && form.get('estado')?.touched) {
        <span class="text-xs text-red-500">Estado obrigatório</span>
      }
    </div>

    <div class="flex items-center gap-3">
      <input
        formControlName="sede"
        type="checkbox"
        id="sede"
        class="w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900 cursor-pointer"
      />
      <label for="sede" class="text-sm font-medium text-gray-700 cursor-pointer"
        >Esta cidade é a sede</label
      >
    </div>

    <div class="flex flex-col sm:flex-row items-center gap-3 pt-2">
      <button
        type="submit"
        class="bg-gray-900 text-white text-sm font-medium px-4 py-2 rounded-md hover:bg-gray-700 transition-colors"
      >
        {{ id ? 'Salvar' : 'Criar' }}
      </button>
      <button
        type="button"
        (click)="salvo.emit()"
        class="text-sm font-medium text-gray-600 hover:text-gray-900 border border-gray-300 rounded-md px-4 py-2 hover:bg-gray-50 transition-colors"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>
