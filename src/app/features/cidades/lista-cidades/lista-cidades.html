<div class="container">
  <h2>Cidades</h2>

  @if (authService.isAdmin() && !mostrarForm) {
    <button mat-raised-button color="primary" (click)="abrirForm()">
      <mat-icon>add</mat-icon>
      Nova Cidade
    </button>
  }

  @if (mostrarForm) {
    <app-form-cidade
      [id]="idSelecionado"
      (salvo)="aoSalvar()" />
  }

  @if (!mostrarForm) {
    <table mat-table [dataSource]="cidades">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let c">{{ c.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let c">{{ c.estado }}</td>
      </ng-container>

      <ng-container matColumnDef="sede">
        <th mat-header-cell *matHeaderCellDef>Sede</th>
        <td mat-cell *matCellDef="let c">{{ c.sede ? 'Sim' : 'Não' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let c">
          @if (authService.isAdmin()) {
            <button mat-icon-button (click)="abrirForm(c.id)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletar(c.id)">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>

    </table>
  }
</div>
