<div class="container">
  <h2>Dashboard</h2>

  <mat-card>
    <mat-card-header>
      <mat-card-title>Total de Movimentações</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ movimentacoes.length }} movimentações registradas</p>
    </mat-card-content>
  </mat-card>

  <h3>Últimas Movimentações</h3>

  <table mat-table [dataSource]="ultimas">

    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let m">{{ m.tipoMovimentacao }}</td>
    </ng-container>

    <ng-container matColumnDef="produto">
      <th mat-header-cell *matHeaderCellDef>Produto</th>
      <td mat-cell *matCellDef="let m">{{ m.produto?.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="quantidade">
      <th mat-header-cell *matHeaderCellDef>Quantidade</th>
      <td mat-cell *matCellDef="let m">{{ m.quantidade }}</td>
    </ng-container>

    <ng-container matColumnDef="data">
      <th mat-header-cell *matHeaderCellDef>Data</th>
      <td mat-cell *matCellDef="let m">
        {{ m.dataMovimentacao | date:'dd/MM/yyyy HH:mm':'America/Sao_Paulo' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>

  </table>
</div>
