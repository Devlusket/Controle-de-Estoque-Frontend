<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Estoque B2B</mat-card-title>
      <mat-card-subtitle>Faça login para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <mat-error>Email inválido</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput formControlName="senha" type="password" />
          @if (form.get('senha')?.invalid && form.get('senha')?.touched) {
            <mat-error>Senha obrigatória</mat-error>
          }
        </mat-form-field>

        @if (erro) {
          <mat-error>{{ erro }}</mat-error>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading">
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
