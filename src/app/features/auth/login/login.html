<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">

    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold text-gray-900">Estoque B2B</h1>
      <p class="text-sm text-gray-500 mt-1">Faça login para continuar</p>
    </div>

    <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700">Email</label>
          <input
            formControlName="email"
            type="email"
            placeholder="admin@example.com"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder:text-gray-400" />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <span class="text-xs text-red-500">Email inválido</span>
          }
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700">Senha</label>
          <input
            formControlName="senha"
            type="password"
            placeholder="••••••••"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder:text-gray-400" />
          @if (form.get('senha')?.invalid && form.get('senha')?.touched) {
            <span class="text-xs text-red-500">Senha obrigatória</span>
          }
        </div>

        @if (erro) {
          <div class="bg-red-50 border border-red-200 rounded-md px-3 py-2">
            <span class="text-xs text-red-600">{{ erro }}</span>
          </div>
        }

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-gray-900 text-white text-sm font-medium py-2 rounded-md hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors mt-2">
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>

      </form>
    </div>

  </div>
</div>
