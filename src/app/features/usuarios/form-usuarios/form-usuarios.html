<div class="bg-white rounded-lg border border-gray-200 p-6 max-w-lg">

  <div class="mb-6">
    <h2 class="text-base font-semibold text-gray-900">{{ id ? 'Editar Usuário' : 'Novo Usuário' }}</h2>
    <p class="text-sm text-gray-500 mt-0.5">{{ id ? 'Atualize os dados do usuário' : 'Preencha os dados do novo usuário' }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-gray-700">Nome</label>
      <input formControlName="nome" type="text" placeholder="Ex: João Silva"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder:text-gray-400" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-gray-700">Email</label>
      <input formControlName="email" type="email" placeholder="joao@example.com"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder:text-gray-400" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-gray-700">Senha</label>
      <input formControlName="senha" type="password" placeholder="••••••••"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder:text-gray-400" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-gray-700">Role</label>
      <select formControlName="role"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all bg-white text-gray-900">
        <option value="CLIENTE">Cliente</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-gray-700">Cidade</label>
      <select formControlName="cidadeId"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all bg-white text-gray-900">
        <option [value]="null" disabled>Selecione uma cidade</option>
        @for (cidade of cidades; track cidade.id) {
          <option [value]="cidade.id">{{ cidade.nome }} — {{ cidade.estado }}</option>
        }
      </select>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <button type="submit"
        class="bg-gray-900 text-white text-sm font-medium px-4 py-2 rounded-md hover:bg-gray-700 transition-colors">
        {{ id ? 'Salvar' : 'Criar' }}
      </button>
      <button type="button" (click)="salvo.emit()"
        class="text-sm font-medium text-gray-600 hover:text-gray-900 border border-gray-300 rounded-md px-4 py-2 hover:bg-gray-50 transition-colors">
        Cancelar
      </button>
    </div>

  </form>
</div>
